name: Build and draft release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-draft:
    name: Build Windows release and create draft
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $semverPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          if ($version -notmatch $semverPattern) {
            throw "VERSION must contain one valid Semantic Version (for example 1.2.3 or 1.2.3-rc.1); got '$version'."
          }

          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $previousVersionEntry = (& git ls-tree "$($env:GITHUB_SHA)^" VERSION | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to inspect VERSION in the previous commit.'
            }

            # On the first release, VERSION is new and has no entry in the parent tree.
            if ($previousVersionEntry) {
              $previousVersion = (& git show "$($env:GITHUB_SHA)^:VERSION" | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) {
                throw 'Unable to read VERSION from the previous commit.'
              }
              if ($previousVersion -eq $version) {
                throw "VERSION did not change from the previous commit ($version)."
              }
            }
          }

      - name: Confirm Visual Studio 2026 is installed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio Installer (vswhere) was not found on this runner.'
          }
          $vs2026 = & $vswhere -products '*' -version '[18.0,19.0)' -property installationPath
          if (-not $vs2026) {
            throw 'This project requires Visual Studio 2026 (version 18.x). The hosted runner does not have it installed yet; use a Windows runner with VS 2026 or update this workflow when the hosted image provides it.'
          }
          Write-Host "Using Visual Studio at $vs2026"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio solution
        shell: pwsh
        run: .\Vendor\premake\premake5.exe vs2026 --arch=x86 --renderer=DX11

      - name: Build Release Win32
        shell: pwsh
        run: msbuild .\OpenBarnyard.slnx -m -p:Configuration=Release -p:Platform=Win32 -verbosity:minimal

      - name: Package build output
        id: package
        shell: pwsh
        run: |
          $output = 'bin\Release_Win32_x86_DX11\OpenBarnyard'
          $executable = Join-Path $output 'BarnyardVR.exe'
          if (-not (Test-Path $executable)) {
            throw "Expected build output was not found: $executable"
          }
          $archive = "OpenBarnyard-$($env:RELEASE_VERSION)-Windows-x86-DX11.zip"
          Compress-Archive -Path (Join-Path $output '*') -DestinationPath $archive -CompressionLevel Optimal
          "archive=$archive" >> $env:GITHUB_OUTPUT
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: pwsh
        run: |
          # Require the previous draft to be published or discarded first. This
          # prevents multiple drafts from generating notes from the same release.
          $drafts = gh release list --json isDraft,tagName --jq '[.[] | select(.isDraft) | .tagName] | join(",")'
          if ($drafts) {
            throw "Publish or delete the existing draft release(s) before creating another: $drafts"
          }

          gh release create $env:RELEASE_TAG $env:RELEASE_ARCHIVE `
            --draft `
            --title "OpenBarnyard $env:RELEASE_VERSION" `
            --generate-notes `
            --target $env:GITHUB_SHA
